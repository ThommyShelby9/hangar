<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a3640"/>
      <stop offset="1" stop-color="#161e24"/>
    </linearGradient>
    <linearGradient id="roof" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffc85a"/>
      <stop offset="1" stop-color="#e9a52c"/>
    </linearGradient>
  </defs>
  <!-- Tarmac tile -->
  <rect x="32" y="32" width="960" height="960" rx="216" fill="url(#ground)"/>
  <!-- Quonset hangar: one bold arch -->
  <path d="M176 606 A336 360 0 0 1 848 606 Z" fill="url(#roof)"/>
  <!-- Corrugated roof rib, clear of the door -->
  <path d="M262 606 A250 290 0 0 1 762 606" fill="none" stroke="#b97d17" stroke-width="18" opacity="0.5"/>
  <!-- Open door -->
  <path d="M384 606 V434 Q384 414 404 414 H620 Q640 414 640 434 V606 Z" fill="#11181d"/>
  <!-- Apron and taxiway centre line leading out -->
  <rect x="136" y="606" width="752" height="28" rx="14" fill="#d5dce0"/>
  <rect x="496" y="676" width="32" height="60" rx="16" fill="#f4b63f"/>
  <rect x="496" y="768" width="32" height="44" rx="16" fill="#f4b63f" opacity="0.55"/>
</svg>
