[package]
name = "hangar"
version = "0.1.0"
description = "Hangar — launcher de jeux"
authors = ["ThommyShelby9"]
edition = "2021"

[lib]
# The `_lib` suffix avoids a name clash between the lib and the bin on Windows,
# see https://github.com/rust-lang/cargo/issues/8519
name = "hangar_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
thiserror = "2"
regex = "1"
reqwest = { version = "0.13", features = ["json"] }
urlencoding = "2"
tauri-plugin-dialog = "2"
sysinfo = { version = "0.39", default-features = false, features = ["system", "disk", "network"] }
nvml-wrapper = "0.13"

[target.'cfg(windows)'.dependencies]
winreg = "0.56"
windows = { version = "0.62", features = ["Win32_Graphics_Dxgi", "Win32_Foundation"] }
# Same versions as Tauri's WebView2 bindings, to tune the webview (see webview_memory.rs).
webview2-com = "0.38"
windows-core-webview = { package = "windows-core", version = "0.61" }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Performance",
    "Win32_System_Power",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
