[package]
name = "hangar"
version = "0.1.0"
description = "Hangar — launcher de jeux"
authors = ["ThommyShelby9"]
edition = "2021"

[lib]
# The `_lib` suffix avoids a name clash between the lib and the bin on Windows,
# see https://github.com/rust-lang/cargo/issues/8519
name = "hangar_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
thiserror = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_UI_WindowsAndMessaging", "Win32_Foundation"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
